<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141518">
<title>Judge Prototype</title>
<style>
/* Bare prototype page (PLAN.md step 2). v0 colors; blue and orange stay reserved for timing, so verdicts use green / red / grey. */
:root{--ground:#141518;--panel:#1B1D21;--pad:#24272C;--seam:#363A41;--line:#7A7F88;--ink-2:#9EA2AA;--ink:#EEEFF1;--ok:#5FD08A;--bad:#FF6B6B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:2;background:var(--ground);border-bottom:1px solid var(--seam);padding:8px max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header b{flex:1 1 auto}
#meter{position:relative;width:120px;height:12px;border-radius:3px;background:var(--pad);overflow:hidden}
#meter::before{content:'';position:absolute;inset:0 auto 0 0;width:calc(var(--lv,0)*100%);background:var(--ink)}
#meter::after{content:'';position:absolute;top:0;bottom:0;left:calc(var(--tr,0)*100%);width:2px;background:var(--bad)}
nav{display:flex;gap:8px;width:100%}
nav button{flex:1 1 0}
main{max-width:860px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
h2{font-size:18px;margin:24px 0 8px}
h3{font-size:17px;margin:0 0 6px}
h4{margin:12px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
p{margin:8px 0}
a{color:var(--ink)}
code{font-size:14px;background:var(--pad);padding:1px 4px;border-radius:3px;word-break:break-all}
button{font:inherit;color:var(--ink);background:var(--pad);border:2px solid var(--line);border-radius:8px;min-height:44px;padding:6px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
button.big{min-height:56px;flex:1 1 100%;font-weight:700;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row a{min-height:44px;display:inline-flex;align-items:center;padding:0 8px}
.dim{color:var(--ink-2);font-size:14px}
.ctl{background:var(--panel);border-radius:12px;padding:8px 16px;margin-bottom:16px}
.msg{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 12px}
.hit{background:var(--panel);border-radius:12px;padding:12px 16px;margin:12px 0;border-left:6px solid var(--line)}
.hit.r-pass{border-left-color:var(--ok)}
.hit.r-fail,.hit.r-wrong{border-left-color:var(--bad)}
.hit .ic{display:inline-block;width:1.2em}
.hit.pro.approved{outline:2px solid var(--ok)}
.hit.pro.rejected{opacity:.55}
.tips{margin:6px 0;padding-left:20px}
.why{font-size:14px;border-top:1px solid var(--seam);margin-top:8px}
.why p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid var(--seam);font-size:14px}
th{color:var(--ink-2);font-weight:500}
tr.bad td,li.bad{color:var(--bad)}
tr.na td{color:var(--line)}
td.ok{color:var(--ok)}
.vetoes{margin:4px 0;padding-left:20px}
details summary{cursor:pointer;color:var(--ink-2);min-height:32px}
</style>
</head>
<body>
<header>
  <b>Judge prototype</b>
  <span id="meter" role="img" aria-label="Mic level, red line is the trigger"></span>
  <nav id="tabs" aria-label="Mode">
    <button type="button" data-mode="judge">Judge</button>
    <button type="button" data-mode="record">Record</button>
    <button type="button" data-mode="pro">Pro clips</button>
    <button type="button" data-mode="takes">Takes</button>
  </nav>
</header>
<main id="app"></main>
<script type="module" src="/src/lab/main.ts"></script>
</body>
</html>
